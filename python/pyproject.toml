[project]
name = "telegram-slack-mcp"
version = "0.2.1"
description = "MCP servers that give Claude access to your personal Telegram and Slack accounts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nileshpatil6" }]
keywords = ["mcp", "model-context-protocol", "claude", "telegram", "slack", "chat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "mcp>=2.0",
  "telethon>=1.44",
  "slack_sdk>=3.43",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/nileshpatil6/telegram-slack-mcp"
Repository = "https://github.com/nileshpatil6/telegram-slack-mcp"
Issues = "https://github.com/nileshpatil6/telegram-slack-mcp/issues"

[project.scripts]
telegram-slack-mcp = "chat_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_mcp"]
